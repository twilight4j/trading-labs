[project]
name = "trading-labs"
version = "0.1.0"
description = "Reproducible KRX market-data ingestion for equity research"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "APScheduler>=3.10,<4",
  "duckdb>=1.1",
  "fastapi>=0.115",
  "finance-datareader>=0.9",
  "matplotlib>=3.8",
  "pandas>=2.2,<3",
  "pyarrow>=16",
  "pykrx>=1.2.8",
  "python-dotenv>=1.0",
  "requests>=2.32",
  "setuptools<82",
  "typer>=0.12",
  "uvicorn>=0.30",
]

[project.scripts]
market-data = "collector.cli:app"
backtest = "backtest.cli:app"
labs-api = "valuation.cli:app"

[dependency-groups]
dev = ["httpx2>=2.13", "pytest>=8.0"]
notebook = ["ipykernel>=6", "jupyterlab>=4"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/collector", "src/backtest", "src/valuation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
